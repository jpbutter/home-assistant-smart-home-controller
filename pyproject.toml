[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "home-assistant-smart-home-controller"
version = "0.1.0"
description = "Testable Python orchestration helpers for Home Assistant"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["httpx>=0.27,<1", "PyYAML>=6.0,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.6,<1"]

[project.scripts]
ha-controller = "ha_controller.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
