[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "home-assistant-smart-home-controller"
version = "0.1.0"
description = "Typed, testable Python control helpers for the Home Assistant REST API"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "jpbutter"}]
maintainers = [{name = "jpbutter"}]
keywords = ["home-assistant", "home-automation", "asyncio", "smart-home", "iot"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
  "Topic :: Home Automation",
]
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "mypy>=1.11,<2",
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.16,<1",
  "twine>=6,<8",
]

[project.scripts]
ha-controller = "ha_controller.cli:main"

[project.urls]
Homepage = "https://github.com/jpbutter/home-assistant-smart-home-controller"
Documentation = "https://github.com/jpbutter/home-assistant-smart-home-controller#readme"
Repository = "https://github.com/jpbutter/home-assistant-smart-home-controller.git"
Issues = "https://github.com/jpbutter/home-assistant-smart-home-controller/issues"
Changelog = "https://github.com/jpbutter/home-assistant-smart-home-controller/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ha_controller = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-config --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
pretty = true
